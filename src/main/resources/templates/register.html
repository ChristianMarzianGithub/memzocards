<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
<h1>Register</h1>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/register}" method="post">
    <label for="email">Email</label><br>
    <input id="email" type="email" name="email" required><br><br>

    <label for="password">Password (min 6 chars)</label><br>
    <input id="password" type="password" name="password" minlength="6" required><br><br>

    <button type="submit">Register</button>
</form>

<p><a th:href="@{/login}">Back to login</a></p>
</body>
</html>
