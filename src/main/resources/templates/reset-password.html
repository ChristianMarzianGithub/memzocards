<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body>
<h1>Reset Password</h1>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/reset-password}" method="post">
    <label for="token">Reset token</label><br>
    <input id="token" type="text" name="token" th:value="${token}" required><br><br>

    <label for="password">New password (min 6 chars)</label><br>
    <input id="password" type="password" name="password" minlength="6" required><br><br>

    <button type="submit">Reset password</button>
</form>

<p><a th:href="@{/login}">Back to login</a></p>
</body>
</html>
