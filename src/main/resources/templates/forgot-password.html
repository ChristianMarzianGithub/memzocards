<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>
<body>
<h1>Forgot Password</h1>

<p th:if="${message}" th:text="${message}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form th:action="@{/forgot-password}" method="post">
    <label for="email">Email</label><br>
    <input id="email" type="email" name="email" required><br><br>
    <button type="submit">Generate reset token</button>
</form>

<div th:if="${token}">
    <p>Your token:</p>
    <code th:text="${token}"></code>
    <p>
        <a th:href="@{/reset-password(token=${token})}">Go to reset password page</a>
    </p>
</div>

<p><a th:href="@{/login}">Back to login</a></p>
</body>
</html>
